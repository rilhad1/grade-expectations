<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Журнал — мобільний</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ge{--bg:#F7F5F0;--surface:#FFFFFF;--surface-2:#FBFAF7;--sunken:#F1EEE7;--line:#E4E0D6;--line-2:#D3CEC2;--text:#1F2328;--text-2:#4E545B;--text-3:#676C73;--accent:#1F3A5F;--accent-soft:#E7EDF4;--accent-line:#B9C8DA;font-family:'Golos Text',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.ge *{box-sizing:border-box}
.ge h1,.ge h2,.ge p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sel{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font:inherit;font-size:15px;font-weight:500;color:var(--text)}
.g{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:6px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sunken)}
.lo{background:#FBECE9}.hi{background:#E6F2E9}
.n{background:#F7E4E1;color:#8F2B22;font-weight:700;font-size:13px}
.np{background:#F9ECD4;color:#7A4A06;font-weight:700;font-size:13px}
.srow{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);width:100%;border-left:0;border-right:0;border-top:0;font:inherit;text-align:left;color:var(--text)}
.muted{color:var(--text-3)}.s2{color:var(--text-2)}
</style>
</helmet>
<div class="ge" style="width: 390px; height: 1160px; position: relative; overflow: hidden">
  <header style="padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="font-size: 26px; line-height: 32px; font-weight: 600">Журнал</h1>
      <button type="button" aria-label="Пошук студента" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px">
      <button type="button" class="sel"><span style="width: 10px; height: 10px; border-radius: 3px; background: #4C6A92"></span><span style="flex: 1; text-align: left">Інформатика</span><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: var(--text-3); stroke-width: 1.7; stroke-linecap: round"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button type="button" class="sel"><span style="flex: 1; text-align: left">ПДт-12</span><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: var(--text-3); stroke-width: 1.7; stroke-linecap: round"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <div class="num s2" style="display: flex; justify-content: space-between; font-size: 13px">
      <span>1-ша рубіжна · до 8 жовт.</span>
      <span>сер. групи 7,9 · 10 занять</span>
    </div>
  </header>

  <div>
    <button type="button" class="srow" aria-expanded="false"><span class="num muted" style="width: 20px; font-size: 13px">1</span><span style="flex: 1">Андрієнко Богдан</span><span class="num s2" style="font-size: 14px">1 пр.</span><span class="g">8,4</span></button>
    <button type="button" class="srow" aria-expanded="false"><span class="num muted" style="width: 20px; font-size: 13px">2</span><span style="flex: 1">Бондар Максим</span><span class="num" style="font-size: 14px; color: #8F2B22">3 пр.</span><span class="g lo">3,6</span></button>
    <button type="button" class="srow" aria-expanded="false"><span class="num muted" style="width: 20px; font-size: 13px">3</span><span style="flex: 1">Васильчук Дарина</span><span class="num s2" style="font-size: 14px">—</span><span class="g">9,1</span></button>
    <button type="button" class="srow" aria-expanded="false"><span class="num muted" style="width: 20px; font-size: 13px">9</span><span style="flex: 1">Іваницький Назар</span><span class="num s2" style="font-size: 14px">—</span><span class="g">7,4</span></button>

    <section aria-label="Коваленко Анна" style="background: var(--surface-2); border-bottom: 1px solid var(--line)">
      <button type="button" class="srow" aria-expanded="true" style="border-bottom: 0; background: transparent"><span class="num muted" style="width: 20px; font-size: 13px">10</span><span style="flex: 1; font-weight: 600">Коваленко Анна</span><span class="num s2" style="font-size: 14px">1 пр.</span><span class="g hi">10,0</span></button>
      <div style="padding: 0 16px 16px 46px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <div style="padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px"><div class="muted" style="font-size: 12px; font-weight: 600">Оцінок</div><div class="num" style="font-size: 18px; font-weight: 600">7</div></div>
          <div style="padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px"><div class="muted" style="font-size: 12px; font-weight: 600">Пропуски</div><div class="num" style="font-size: 18px; font-weight: 600">1 <span class="muted" style="font-size: 13px; font-weight: 500">(0 пов.)</span></div></div>
          <div style="padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px"><div class="muted" style="font-size: 12px; font-weight: 600">Прогноз</div><div class="num" style="font-size: 18px; font-weight: 600">10</div></div>
        </div>
        <div style="display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--line)"><span class="num muted" style="width: 64px; font-size: 14px">5 жовт.</span><span style="flex: 1; font-size: 15px">Практична</span><span class="g hi">10</span></div>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--line)"><span class="num muted" style="width: 64px; font-size: 14px">28 вер.</span><span style="flex: 1; font-size: 15px">Контрольна</span><span class="g">9</span></div>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--line)"><span class="num muted" style="width: 64px; font-size: 14px">24 вер.</span><span style="flex: 1; font-size: 15px">Лекція</span><span class="g n">н</span></div>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--line)"><span class="num muted" style="width: 64px; font-size: 14px">21 вер.</span><span style="flex: 1; font-size: 15px">Лабораторна</span><span class="g hi">11</span></div>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 44px"><span class="num muted" style="width: 64px; font-size: 14px">14 вер.</span><span style="flex: 1; font-size: 15px">Практична</span><span class="g">9</span></div>
        </div>
        <a href="StudentCard.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid var(--line-2); border-radius: 6px; color: var(--accent); font-weight: 600; font-size: 15px; text-decoration: none">Уся картка студента</a>
      </div>
    </section>

    <button type="button" class="srow" aria-expanded="false"><span class="num muted" style="width: 20px; font-size: 13px">11</span><span style="flex: 1">Кравець Юлія</span><span class="num s2" style="font-size: 14px">—</span><span class="g">8,0</span></button>
    <button type="button" class="srow" aria-expanded="false"><span class="num muted" style="width: 20px; font-size: 13px">12</span><span style="flex: 1">Лисенко Роман</span><span class="num s2" style="font-size: 14px">1 пр.</span><span class="g">5,8</span></button>
    <button type="button" class="srow" aria-expanded="false"><span class="num muted" style="width: 20px; font-size: 13px">13</span><span style="flex: 1">Мазур Христина</span><span class="num s2" style="font-size: 14px">—</span><span class="g">9,2</span></button>
    <button type="button" class="srow" aria-expanded="false"><span class="num muted" style="width: 20px; font-size: 13px">14</span><span style="flex: 1">Мельник Остап</span><span class="num s2" style="font-size: 14px">—</span><span class="g">7,2</span></button>
  </div>

  <div style="position: absolute; left: 0; bottom: 0">
    <dc-import name="MobileNav" active="journal" hint-size="390px,80px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
