<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Нижня панель</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Меню" style="width: 390px; height: 80px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 8px 16px; background: var(--surface, #FFFFFF); border-top: 1px solid var(--line, #E4E0D6); font-family: 'Golos Text', system-ui, sans-serif">
  <a href="TodayMobile.dc.html" style="{{s.today}}"><svg viewBox="0 0 24 24" style="{{icon}}"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><rect x="7" y="13" width="4" height="4" rx="1"></rect></svg>Сьогодні</a>
  <a href="ScheduleMobile.dc.html" style="{{s.schedule}}"><svg viewBox="0 0 24 24" style="{{icon}}"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M9 9v12M15 9v12M3 15h18"></path></svg>Розклад</a>
  <a href="GradebookMobile.dc.html" style="{{s.journal}}"><svg viewBox="0 0 24 24" style="{{icon}}"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Журнал</a>
  <a href="MoreMobile.dc.html" style="{{s.more}}"><svg viewBox="0 0 24 24" style="{{icon}}"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Ще</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","schedule","journal","more"],"default":"today"},"$preview":{"width":390,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'today';
    const base = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;text-decoration:none;font-size:12px;font-weight:500;border-radius:8px;';
    const s = {};
    ['today','schedule','journal','more'].forEach((k) => {
      s[k] = base + (k === a ? 'color:var(--accent,#1F3A5F);font-weight:600;' : 'color:var(--text-3,#676C73);');
    });
    return {
      s,
      icon: 'width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round'
    };
  }
}
</script>
</body>
</html>
