services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ge
      POSTGRES_PASSWORD: ge
      POSTGRES_DB: ge
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ge']
      interval: 5s
      retries: 10
  # DOCX → PDF для відомостей (необов'язково): GOTENBERG_URL=http://localhost:3200
  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ['3200:3000']
volumes:
  pgdata:
