services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ge
      POSTGRES_PASSWORD: ge
      POSTGRES_DB: ge
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ge']
      interval: 5s
      retries: 10
volumes:
  pgdata:
