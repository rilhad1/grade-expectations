name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ge
          POSTGRES_PASSWORD: ge
          POSTGRES_DB: ge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ge" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ge:ge@localhost:5432/ge_test
      TEST_DATABASE_URL: postgresql://ge:ge@localhost:5432/ge_test
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      WEB_ORIGIN: http://localhost:5173
      DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm db:seed # повторний seed не має нічого дублювати
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
