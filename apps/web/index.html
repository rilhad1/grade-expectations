<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F3A5F" />
    <script>
      // Тема застосовується до першого малювання, щоб темна тема не миготіла світлою
      try {
        var m = localStorage.getItem('mui-mode') || 'system';
        var d =
          m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-color-scheme', d ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <title>Grade Expectations</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
